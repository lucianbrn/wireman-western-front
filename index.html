<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ralph Tjarks Brucker — Wireman of the Western Front</title>
<style>
  html,body{margin:0;height:100%;background:#0e0f0b;color:#e9dfc2;
    font-family:Georgia,'Times New Roman',serif}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px}
  #boot .card{max-width:520px}
  #boot h1{font-weight:600;letter-spacing:.04em;font-size:30px;margin:0 0 8px}
  #boot p{color:#b8a97f;line-height:1.6;margin:6px 0}
  #boot .spin{width:34px;height:34px;margin:22px auto 6px;border-radius:50%;
    border:3px solid #57503c;border-top-color:#d9b269;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div class="card">
  <h1>Ralph Tjarks Brucker</h1>
  <p>Wireman of the Western Front</p>
  <div class="spin" aria-hidden="true"></div>
  <p id="bootmsg">Loading the exhibit…</p>
</div></div>
<script>
(function(){
  var msg = document.getElementById('bootmsg');
  function fail(t){ if(msg) msg.textContent = t; }

  /* The exhibit itself lives in the numbered file beside this loader.
     Use the newest one present, so a future upload supersedes this build. */
  var candidates = [];
  for (var n = 12; n >= 4; n--) candidates.push('index (' + n + ').html');

  function fetchFirst(list){
    if(!list.length) return Promise.reject(new Error('not found'));
    var url = list[0];
    return fetch(url, {cache:'no-cache'}).then(function(r){
      if(!r.ok) throw new Error('bad status');
      return r.text();
    }).catch(function(){ return fetchFirst(list.slice(1)); });
  }

  function patch(t){
    /* The film must roll on its own: drop the motion gate that parks the
       belt on machines with a reduce-motion setting. */
    if (t.indexOf('PATCHED_NOMOTION') === -1) {
      t = t.replace('function motionOK(){ return !manualMotion && !reduceMQ.matches; }',
        'function motionOK(){ return !manualMotion; } /* PATCHED_NOMOTION */');
    }
    /* Pictures fill their whole frame on the belt and are always fully
       visible; photo panels never scroll internally. */
    if (t.indexOf('PATCHED_PHOTOFILL') === -1) {
      var css = '.panel.has-photo{display:flex;flex-direction:column;overflow:hidden}'
        + '.panel.has-photo .plate{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin:8px 0 2px}'
        + '.panel.has-photo .plate img{flex:1 1 auto;min-height:0;height:100%;max-height:none;width:100%}'
        + '.panel.has-photo .plate figcaption{flex:0 0 auto}'
        + '/* PATCHED_PHOTOFILL */';
      t = t.replace('</style>', css + '</style>');
      t = t.replace("s.className='panel'+(p.cls?' '+p.cls:'');",
        "s.className='panel'+(p.cls?' '+p.cls:'')+(p.photo?' has-photo':'');");
    }
    /* Start the film automatically once loaded; sound joins on the first
       tap or click anywhere, which is the earliest browsers allow it. */
    if (t.indexOf('PATCHED_AUTOSTART') === -1) {
      var js = '\n;/* PATCHED_AUTOSTART */\n'
        + 'window.addEventListener("load",function(){setTimeout(function(){'
        + 'try{ if(!started){ started=true; paused=false; explicitPause=false; pos=0;'
        + ' veil.style.opacity="0"; setTimeout(function(){veil.hidden=true;},650);'
        + ' render(); run(); } }catch(e){}'
        + ' var kick=function(){ document.removeEventListener("pointerdown",kick);'
        + ' document.removeEventListener("keydown",kick);'
        + ' try{ startProjectorSfx(); radioPlay(); }catch(e){} };'
        + ' document.addEventListener("pointerdown",kick);'
        + ' document.addEventListener("keydown",kick);'
        + '},400);});\n';
      t = t.replace('</body>', '<script>' + js + '<\/script></body>');
    }
    return t;
  }

  fetchFirst(candidates).then(function(text){
    var finalHtml = patch(text);
    document.open(); document.write(finalHtml); document.close();
  }).catch(function(){ fail('The exhibit file could not be loaded. Please check your connection and refresh.'); });
})();
</script>
</body>
</html>
